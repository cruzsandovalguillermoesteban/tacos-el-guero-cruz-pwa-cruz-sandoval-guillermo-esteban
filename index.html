<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Tacos el Güero Cruz — PWA</title>
  <meta name="description" content="Tacos el Güero: Los mejores tacos de asada, tripa y especialidades sonorenses.">

  <!-- COMENTAMOS MANIFEST E ICONO -->
  <!-- <link rel="manifest" href="manifest.json"> -->
  <meta name="theme-color" content="#DC2626">
  <!-- <link rel="icon" href="icons/icon.svg" type="image/svg+xml"> -->

  <link rel="stylesheet" href="css/estilos.css">

  <!-- ESTILOS PARA LOS BOTONES DE FILTRO TIPO PÍLDORA -->
  <style>
    .filtros-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .btn-filtro {
      background: #1C1917;
      color: white;
      border: 1px solid #444;
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95em;
      transition: all 0.2s ease-in-out;
    }
    .btn-filtro.activo {
      background: #DC2626;
      color: white;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 2px #DC2626;
    }
  </style>

  <!-- COMENTAMOS EL MAPA -->
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"> -->
</head>
<body>

  <!-- ============ APP SHELL ============ -->
  <header class="appbar">
    <div class="marca">
      <img src="img/tacos.png" alt="Logo Tacos el Güero" class="logo-encabezado">
      <h1>Tacos el Güero Cruz</h1>
    </div>
    <span id="estado-conexion" class="pill">conectado</span>
  </header>
  
  <main>
    <!-- ---- Sección 1: Catálogo (CSR) con Filtros ---- -->
    <section>
      <h2 style="text-align: center;">Nuestro Menú</h2>
      
      <!-- Botones de Filtro -->
      <div class="filtros-container">
        <button class="btn-filtro activo" data-categoria="Todos">Todos</button>
        <button class="btn-filtro" data-categoria="Tacos">Tacos</button>
        <button class="btn-filtro" data-categoria="Especialidades">Especialidades</button>
        <button class="btn-filtro" data-categoria="Bebidas y extras">Bebidas y extras</button>
      </div>

      <div id="catalogo" class="grid" aria-busy="true" aria-label="Cargando catálogo">
        <!-- Esqueletos de carga -->
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
        <div class="producto producto--cargando" aria-hidden="true"><div class="producto__foto"></div><strong>&nbsp;</strong><span class="precio">&nbsp;</span><p>&nbsp;</p><button type="button" disabled>Agregar al carrito</button></div>
      </div>
    </section>

    <!-- ---- Sección 2: Carrito ---- -->
    <aside id="zona-carrito" style="border: 2px solid #DC2626; padding: 1rem; margin: 2rem 0; border-radius: 8px;">
      <h2 style="color: #DC2626; margin-top: 0;">🛒 Tu Pedido</h2>
      
      <ul id="carrito-lista" style="list-style: none; padding: 0;">
        <!-- Aquí se inyectan los tacos por JS -->
      </ul>
      
      <h3 style="text-align: right;">Total: $<span id="carrito-total">0</span></h3>
      
      <div style="text-align: center; margin-top: 15px;">
        <button id="btn-sincronizar" style="background: #1C1917; color: white; padding: 10px; border-radius: 5px;">Sincronizar Pedido</button>
        <p id="carrito-mensaje" style="font-size: 0.9em; color: gray; margin-top: 5px;"></p>
      </div>
    </aside>

    <!-- ---- Sección 3: Notificaciones ---- -->
    <section>
      <h2>Notificaciones de ofertas</h2>
      <button id="btn-notificar" type="button">Activar notificaciones</button>
      <p id="notificaciones-mensaje" class="mensaje"></p>
    </section>

    <!-- ---- Sección 4: Ubicación ---- -->
    <section>
      <h2>Distancia a la sucursal</h2>
      <p class="sucursal-info">Sucursal única: <strong>Hermosillo, Sonora.</strong></p>
      <button id="btn-ubicacion" type="button">Usar mi ubicación</button>
      <p id="ubicacion-mensaje" class="mensaje"></p>
      <div id="mapa-ruta" class="mapa" hidden></div>
    </section>
  </main>

  <footer>
    <p>Tacos el Güero Cruz © 2026</p>
    <p>Alumno: Cruz Sandoval Guillermo Esteban</p>
  </footer>

  <!-- SCRIPTS ACTIVOS PARA EL AVANCE 2 (Carrito y CSR) -->
  <script src="js/carrito.js"></script>
  <script src="js/csr.js"></script>
  
  <!-- SCRIPTS COMENTADOS HASTA FUTUROS AVANCES -->
  <script src="js/notificaciones.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/geolocalizacion.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <!-- <script src="js/app.js"></script> -->

    }

  -->
</body>
</html>
