<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- 1. CAMBIAMOS EL TÍTULO Y DESCRIPCIÓN -->
  <title>Tacos el Güero Cruz — PWA</title>
  <meta name="description" content="Tacos el Güero: Los mejores tacos de asada, tripa y especialidades sonorenses.">

  <!-- 2. COMENTAMOS MANIFEST E ICONO (Se usan hasta el avance 3) -->

</head>
<body>

  <!-- ============ APP SHELL ============ -->
    <header class="appbar">
    <div class="marca">
      <!-- CAMBIA "logo.png" por el nombre exacto de tu imagen -->
      <img src="img/tacos.png" alt="Logo Tacos el Güero" class="logo-encabezado">
      <h1>Tacos el Güero Cruz</h1>
    </div>
    <span id="estado-conexion" class="pill">conectado</span>
    </header>
    <main>
    <!-- ---- Sección 1: Catálogo (CSR) ---- -->
    <section>
      <h2>Nuestro Menú</h2>
      <!-- Dejamos los 4 esqueletos tal como vienen en el ejemplo -->
      <div id="catalogo" class="grid" aria-busy="true" aria-label="Cargando catálogo">
        <div class="producto producto--cargando" aria-hidden="true">
          <div class="producto__foto"></div>
          <strong>&nbsp;</strong> <span class="precio">&nbsp;</span> <p>&nbsp;</p>
          <button type="button" disabled>Agregar al carrito</button>
        </div>
        <div class="producto producto--cargando" aria-hidden="true">
          <div class="producto__foto"></div>
          <strong>&nbsp;</strong> <span class="precio">&nbsp;</span> <p>&nbsp;</p>
          <button type="button" disabled>Agregar al carrito</button>
        </div>
        <div class="producto producto--cargando" aria-hidden="true">
          <div class="producto__foto"></div>
          <strong>&nbsp;</strong> <span class="precio">&nbsp;</span> <p>&nbsp;</p>
          <button type="button" disabled>Agregar al carrito</button>
        </div>
        <div class="producto producto--cargando" aria-hidden="true">
          <div class="producto__foto"></div>
          <strong>&nbsp;</strong> <span class="precio">&nbsp;</span> <p>&nbsp;</p>
          <button type="button" disabled>Agregar al carrito</button>
        </div>
      </div>
    </section>

    <!-- ---- Sección 2: Carrito ---- -->
    <section>
      <h2>Carrito</h2>
      <ul id="carrito-lista"></ul>
      <p>Total: $<span id="carrito-total">0</span></p>
      <button id="btn-sincronizar" type="button">Sincronizar carrito</button>
      <p id="carrito-mensaje" class="mensaje"></p>
    </section>

    <!-- ---- Sección 3: Notificaciones ---- -->
    <section>
      <h2>Notificaciones de ofertas</h2>
      <button id="btn-notificar" type="button">Activar notificaciones</button>
      <p id="notificaciones-mensaje" class="mensaje"></p>
    </section>

    <!-- ---- Sección 4: Ubicación ---- -->
    <section>
      <h2>Distancia a la sucursal</h2>
      <p class="sucursal-info">Sucursal única: <strong>Hermosillo, Sonora.</strong></p>
      <button id="btn-ubicacion" type="button">Usar mi ubicación</button>
      <p id="ubicacion-mensaje" class="mensaje"></p>
      <div id="mapa-ruta" class="mapa" hidden></div>
    </section>
  </main>

  <footer>
    <!-- 5. PERSONALIZAMOS EL FOOTER CON TUS DATOS -->
    <p>Tacos el Güero Cruz © 2026</p>
    <p>Alumno: Cruz Sandoval Guillermo Esteban</p>
  </footer>

  <!-- 6. COMENTAMOS TODOS LOS SCRIPTS EXCEPTO CSR.JS COMO PIDE LA GUÍA -->

  <script src="js/csr.js"></script>
